{% extends 'base.html' %}

{% block title %}Login | StartupSphere{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-primary">Welcome Back</h3>
                <p class="text-muted">Log in to your account.</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="id_username" class="form-label fw-medium">Username</label>
                    <input type="text" name="username" class="form-control" id="id_username" required>
                </div>
                
                <div class="mb-3">
                    <label for="id_password" class="form-label fw-medium">Password</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                
                {% if form.errors %}
                    <div class="text-danger small mb-3">
                        Your username and password didn't match. Please try again.
                    </div>
                {% endif %}
                
                <button type="submit" class="btn btn-primary w-100 py-2 mt-2 fw-bold">Log In</button>
            </form>
            
            <div class="text-center mt-4">
                <p class="text-muted small">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-primary text-decoration-none fw-medium">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
