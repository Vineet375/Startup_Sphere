{% load static %}
<div class="sidebar d-none d-lg-block px-3" style="width: 250px; flex-shrink: 0;">
    <div class="nav flex-column mb-auto">
        <a href="{% url 'dashboard:home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
            <i class="bi bi-house-door"></i>
            Dashboard
        </a>
        
        {% if request.user.role == 'founder' or request.user.startup_teams.exists %}
        <a href="{% url 'incubator:startup_detail' %}" class="nav-link {% if 'startup' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-rocket"></i>
            My Startup
        </a>
        
        <a href="{% url 'incubator:idea_list' %}" class="nav-link {% if 'idea' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-lightbulb"></i>
            My Ideas
        </a>
        
        <a href="{% url 'incubator:team_list' %}" class="nav-link {% if 'team' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-people"></i>
            My Team
        </a>
        
        <a href="{% url 'incubator:document_list' %}" class="nav-link {% if 'document' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-folder2-open"></i>
            Documents
        </a>
        {% endif %}
        
        <a href="{% url 'dashboard:coming_soon' feature='funding' %}" class="nav-link {% if request.resolver_match.url_name == 'coming_soon' and feature_slug == 'funding' %}active{% endif %}">
            <i class="bi bi-currency-dollar"></i>
            Funding (CRM)
        </a>
        
        <a href="{% url 'dashboard:coming_soon' feature='hiring' %}" class="nav-link {% if request.resolver_match.url_name == 'coming_soon' and feature_slug == 'hiring' %}active{% endif %}">
            <i class="bi bi-person-badge"></i>
            Hiring
        </a>
        
        <a href="{% url 'dashboard:coming_soon' feature='investors' %}" class="nav-link {% if request.resolver_match.url_name == 'coming_soon' and feature_slug == 'investors' %}active{% endif %}">
            <i class="bi bi-briefcase"></i>
            Investors
        </a>
        
        <a href="{% url 'dashboard:coming_soon' feature='applications' %}" class="nav-link {% if request.resolver_match.url_name == 'coming_soon' and feature_slug == 'applications' %}active{% endif %}">
            <i class="bi bi-file-earmark-text"></i>
            Applications
        </a>
        
        <a href="{% url 'dashboard:coming_soon' feature='events' %}" class="nav-link {% if request.resolver_match.url_name == 'coming_soon' and feature_slug == 'events' %}active{% endif %}">
            <i class="bi bi-calendar-event"></i>
            Events
        </a>
        
        <a href="{% url 'dashboard:coming_soon' feature='messages' %}" class="nav-link {% if request.resolver_match.url_name == 'coming_soon' and feature_slug == 'messages' %}active{% endif %}">
            <i class="bi bi-chat-left-dots"></i>
            Messages
        </a>
        
        <a href="{% url 'dashboard:coming_soon' feature='analytics' %}" class="nav-link {% if request.resolver_match.url_name == 'coming_soon' and feature_slug == 'analytics' %}active{% endif %}">
            <i class="bi bi-graph-up"></i>
            Analytics
        </a>
        
        <a href="{% url 'incubator:startup_directory' %}" class="nav-link mt-2 {% if 'directory' in request.resolver_match.url_name %}active{% endif %}">
            <i class="bi bi-globe"></i>
            Startup Directory
        </a>
        
        <a href="{% url 'dashboard:profile' %}" class="nav-link {% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
            <i class="bi bi-gear"></i>
            Settings
        </a>
    </div>
</div>
